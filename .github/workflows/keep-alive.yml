name: Keep Alive
on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Services
        run: |
          echo "Pinging ChatBot-BE..."
          curl -s -f https://chatbot-be-tjge.onrender.com/api || echo "ChatBot-BE ping failed"
          
          echo "Pinging ChatbotAI..."
          curl -s -f https://chatbotai-ygqn.onrender.com || echo "ChatbotAI ping failed"
